:root{
  --ink:#000000;
  --paper:#FFFFFF;
  --f-d:'HD Baslik','Archivo',Arial,sans-serif;
  --f-t:'HD Metin','Inter',Arial,sans-serif;
  --f-m:'HD Teknik','IBM Plex Mono',ui-monospace,monospace;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--paper);color:var(--ink)}
body{font-family:var(--f-t);-webkit-font-smoothing:antialiased;print-color-adjust:exact;-webkit-print-color-adjust:exact}
.app{display:grid;grid-template-columns:440px minmax(0,1fr);min-height:100vh}
.editor{border-right:1px solid var(--ink);height:100vh;position:sticky;top:0;overflow-y:auto;background:var(--paper)}
.bar{position:sticky;top:0;z-index:5;background:var(--paper);border-bottom:1px solid var(--ink);padding:16px 20px;display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.bar .brand{flex:1 0 100%;display:flex;align-items:center;justify-content:space-between;margin-bottom:6px}
.bar .brand svg{height:16px;width:auto}
.btn{font:500 13px/1 var(--f-t);border:1px solid var(--ink);background:var(--paper);color:var(--ink);padding:9px 12px;cursor:pointer}
.btn.primary{background:var(--ink);color:var(--paper)}
.btn:hover{outline:1px solid var(--ink)}
.btn:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
.hint{font:400 12px/1.5 var(--f-t);padding:12px 20px;border-bottom:1px solid var(--ink)}
fieldset{border:0;border-bottom:1px solid var(--ink);margin:0;padding:18px 20px 22px}
legend{font:500 11px/1 var(--f-m);letter-spacing:.12em;text-transform:uppercase;padding:0;margin-bottom:14px;float:left;width:100%}
.f{display:grid;gap:5px;margin-bottom:12px;clear:both}
.f label,.lbl{font:500 10.5px/1.3 var(--f-m);letter-spacing:.1em;text-transform:uppercase}
input,textarea,select{font:400 14px/1.4 var(--f-t);color:var(--ink);background:var(--paper);border:1px solid var(--ink);border-radius:0;padding:8px 9px;width:100%}
textarea{min-height:84px;resize:vertical}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px;clear:both}
.rows{display:grid;gap:8px;clear:both}
.item{display:grid;gap:6px;border:1px solid var(--ink);padding:10px;position:relative}
.item .grid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:6px}
.item .x{position:absolute;top:6px;right:6px;border:0;background:none;font:500 18px/1 var(--f-t);cursor:pointer;padding:2px 6px}
.sum{font:500 13px/1.6 var(--f-m);margin-top:10px;clear:both}
.check{display:flex;gap:8px;align-items:center;font:400 14px var(--f-t);clear:both;margin-bottom:12px}
.check input{width:auto}
.note{font:400 12px/1.5 var(--f-t);clear:both;margin:0 0 10px}
.preview{padding:36px 28px 80px;overflow-x:auto}
.doc{width:210mm;margin:0 auto}
.sheet{width:210mm;background:var(--paper);border:1px solid var(--ink);margin:0 auto 10mm}
.cover{height:297mm;position:relative;overflow:hidden}
.flow{padding:30mm 20mm 24mm}
.pb{border-top:1px dashed var(--ink);margin:10mm -20mm;position:relative}
.pb::after{content:"Yeni sayfa";position:absolute;right:20mm;top:-7px;background:var(--paper);padding:0 6px;font:500 9px var(--f-m);letter-spacing:.1em;text-transform:uppercase}
.c-logo{position:absolute;left:20mm;top:18mm;height:8.5mm}
.c-logo svg{height:100%;width:auto;display:block}
.c-no{position:absolute;right:20mm;top:18mm;text-align:right}
.mono-l{font:500 6.5pt/1.4 var(--f-m);letter-spacing:.12em;text-transform:uppercase}
.mono-v{font:500 9pt/1.4 var(--f-m)}
.tag{display:inline-block;border:.25mm solid var(--ink);padding:1mm 2mm;margin-top:3mm}
.c-title{position:absolute;left:19mm;top:56mm;font:600 30mm/1 var(--f-d);letter-spacing:-.02em;margin:0}
.c-title .dot{display:inline-block;width:.13em;height:.13em;margin-left:.06em;vertical-align:baseline}
.c-client{position:absolute;left:20mm;top:128mm;right:20mm}
.c-client .firm{font:500 7mm/1.15 var(--f-d);margin:0}
.c-client .proj{font:400 3.6mm/1.4 var(--f-t);margin:3mm 0 0;max-width:120mm}
.c-mark{position:absolute;width:123.6mm;height:200mm;right:20mm;top:168mm}
.c-mark svg{width:100%;height:100%;display:block}
.c-info{position:absolute;left:20mm;bottom:12mm;display:grid;gap:4.5mm;width:40mm}
.c-info .v{font:500 2.8mm/1.35 var(--f-t);margin-top:1mm}
.c-info a{color:var(--ink);text-decoration:none}
.sec{display:grid;grid-template-columns:36mm minmax(0,1fr);gap:8mm;padding:7mm 0 8mm;border-top:.25mm solid var(--ink)}
.sec{break-inside:avoid}
.sec.long{break-inside:auto}
.sec h2,.sec h3{break-after:avoid}
.sec .rail{padding-top:1.6mm}
.sec h2{font:600 15pt/1.15 var(--f-d);margin:0 0 4mm;letter-spacing:-.005em}
.sec h3{font:600 10.5pt/1.3 var(--f-d);margin:5mm 0 2mm}
.sec p{font:400 9.5pt/1.6 var(--f-t);margin:0 0 3mm;max-width:118mm;white-space:pre-line}
.sec ul{list-style:none;margin:0 0 2mm;padding:0;max-width:122mm}
.sec li{font:400 9.5pt/1.55 var(--f-t);padding:1.2mm 0 1.2mm 6mm;position:relative;border-bottom:.15mm solid var(--ink)}
.sec li:last-child{border-bottom:0}
.sec li::before{content:"";position:absolute;left:0;top:3.2mm;width:1.6mm;height:1.6mm;background:var(--ink);clip-path:polygon(23.6% 0,76.4% 0,100% 23.6%,100% 76.4%,76.4% 100%,23.6% 100%,0 76.4%,0 23.6%)}
table{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums}
th{font:500 6.5pt/1.3 var(--f-m);letter-spacing:.12em;text-transform:uppercase;text-align:left;padding:0 3mm 2mm 0;border-bottom:.35mm solid var(--ink)}
td{font:400 9pt/1.45 var(--f-t);padding:2.2mm 3mm 2.2mm 0;border-bottom:.15mm solid var(--ink);vertical-align:top}
th.r,td.r{text-align:right;padding-right:0}
tr.tot td{border-bottom:0;font-weight:500}
tr.grand td{border-top:.35mm solid var(--ink);font:600 10.5pt/1.4 var(--f-d);padding-top:3mm}
thead{display:table-header-group}
tr{break-inside:avoid}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:6mm;margin:2mm 0 5mm}
.stats .n{font:600 22pt/1 var(--f-d);letter-spacing:-.02em}
.sign{display:grid;grid-template-columns:1fr 1fr;gap:10mm;margin-top:4mm}
.sign .box{border-top:.35mm solid var(--ink);padding-top:3mm}
.sign .ln{border-bottom:.15mm solid var(--ink);height:9mm;display:flex;align-items:flex-end;padding-bottom:1mm;font:400 9pt var(--f-t)}
.sign .ln span{font:500 6.5pt var(--f-m);letter-spacing:.12em;text-transform:uppercase;margin-right:3mm}
.sign .sig{height:22mm}
.contact{display:flex;gap:10mm;margin-top:6mm;flex-wrap:wrap}
.contact a{color:var(--ink);text-decoration:none}
.break{break-before:page}
@media (max-width:1100px){.app{grid-template-columns:minmax(0,1fr)}.editor{position:static;height:auto;border-right:0;border-bottom:1px solid var(--ink)}}
@page{size:A4;margin:30mm 20mm 24mm 20mm}
@page cover{margin:0}
@media print{
  .editor{display:none}
  .app{display:block}
  .preview{padding:0}
  .doc{width:auto}
  .sheet{border:0;margin:0;width:auto}
  .cover{page:cover;width:210mm;height:297mm;break-after:page}
  .flow{padding:0}
  .pb{border:0;margin:0;height:0;break-before:page}
  .pb::after{content:none}
}
</style>
<style id="pagecss"></style>
</head>
<body>
<div class="app">

function totals() {

  const kdv = sub * (Number(state.kdv) || 0) / 100;
  return {sub, kdv, total: sub + kdv};
}

function field(label, key, type = "text", extra = "") {

}

  <div class="sheet cover">
    <div class="c-logo">${LOGO}</div>
    <div class="c-no"><div class="mono-l">Teklif no</div><div class="mono-v">${esc(state.teklifNo)}</div>${state.ornek ? '<div class="mono-l tag">Örnek teklif</div>' : ""}</div>
    <h1 class="c-title">Proje<br>teklifi${dotSvg}</h1>
    <div class="c-client"><p class="firm">${esc(state.musteriFirma || "Müşteri adı")}</p><p class="proj">${esc(state.projeAdi)}</p></div>
    <div class="c-mark">${markSvg("")}</div>
    <div class="c-info">
      <div><div class="mono-l">Hazırlayan</div><div class="v">${esc(state.hazirlayan)}, ${esc(state.unvan)}</div></div>
      <div><div class="mono-l">Tarih</div><div class="v">${dateTR(state.tarih)}</div></div>
      <div><div class="mono-l">Geçerlilik</div><div class="v">${esc(state.gecerlilik)} gün</div></div>
      <div><div class="mono-l">Telefon · WhatsApp</div><div class="v"><a href="${BRAND.wa_link}">${BRAND.phone}</a><br><a href="${BRAND.url}">${BRAND.domain}</a></div></div>
    </div>
  </div>`;
  const takvim = state.takvim.filter(r => r.asama || r.sure || r.cikti);
  const kalemler = state.kalemler.filter(r => r.aciklama || Number(r.fiyat));
  const pricing = `
    <table><thead><tr><th>Kalem</th><th class="r">Miktar</th><th class="r">Birim fiyat</th><th class="r">Tutar</th></tr></thead><tbody>
    ${kalemler.map(k => `<tr><td>${esc(k.aciklama)}</td><td class="r">${esc(k.miktar)} ${esc(k.birim)}</td><td class="r">${money(k.fiyat)}</td><td class="r">${money((Number(k.miktar) || 0) * (Number(k.fiyat) || 0))}</td></tr>`).join("")}
    <tr class="tot"><td colspan="3">Ara toplam</td><td class="r">${money(t.sub)}</td></tr>
    <tr class="tot"><td colspan="3">KDV (%${esc(state.kdv)})</td><td class="r">${money(t.kdv)}</td></tr>
    <tr class="grand"><td colspan="3">Genel toplam</td><td class="r">${money(t.total)}</td></tr>
    </tbody></table>
    ${lines(state.odeme).length ? `<h3>Ödeme planı</h3>${list(state.odeme)}` : ""}`;
  const flow = `
  <div class="sheet flow">
    ${sec("01", "Özet", state.projeAdi || "Proje özeti", `<p>${esc(state.ozet)}</p>`)}
    ${sec("02", "Kapsam", "Kapsam", `${list(state.dahil)}${lines(state.haric).length ? `<h3>Kapsam dışı</h3>${list(state.haric)}` : ""}`, "long")}
    ${takvim.length ? sec("03", "Takvim", "Teslimatlar ve takvim", `<table><thead><tr><th>Aşama</th><th>Süre</th><th>Çıktı</th></tr></thead><tbody>${takvim.map(r => `<tr><td>${esc(r.asama)}</td><td>${esc(r.sure)}</td><td>${esc(r.cikti)}</td></tr>`).join("")}</tbody></table>`) : ""}
    ${sec("04", "Fiyat", "Fiyatlandırma", pricing, "long")}
    ${state.bakimVar ? sec("05", "Bakım", "Bakım ve destek", `<p>Yayından sonra sistem aylık bakım ve destek sözleşmesiyle güncel, güvenli ve izlenir halde tutulur.</p><table><tbody><tr class="grand"><td>Aylık ücret (KDV hariç)</td><td class="r">${money(state.bakimUcret)}</td></tr></tbody></table>${list(state.bakimKapsam)}`) : ""}
    ${sec(state.bakimVar ? "06" : "05", "Neden biz", `Neden ${BRAND.name}`, `<div class="stats"><div><div class="n">${BRAND.years}</div><div class="mono-l">Yıl tecrübe</div></div><div><div class="n">${BRAND.projects}</div><div class="mono-l">Tamamlanan proje</div></div><div><div class="n">3</div><div class="mono-l">Çalışma modeli</div></div></div><p>Proje bazlı geliştirme, bakım ve destek ile danışmanlık modelleriyle Türkiye genelinde çalışıyoruz. Her proje yazılı kapsam, net takvim ve aşama aşama teslimle ilerler.</p>`)}
    ${sec(state.bakimVar ? "07" : "06", "Koşullar", "Koşullar", list(kosullar.join("\n")))}
    ${sec(state.bakimVar ? "08" : "07", "Onay", "Onay", `<p>Bu teklifi kabul ediyorsanız imzalayıp WhatsApp üzerinden iletmeniz yeterlidir.</p>
      <div class="sign">
        <div class="box"><div class="mono-l">Müşteri</div><div class="ln"><span>Firma</span>${esc(state.musteriFirma)}</div><div class="ln"><span>Ad soyad</span>${esc(state.musteriYetkili)}</div><div class="ln"><span>Tarih</span></div><div class="ln sig"><span>İmza · kaşe</span></div></div>
        <div class="box"><div class="mono-l">${BRAND.name}</div><div class="ln"><span>Ad soyad</span>${esc(state.hazirlayan)}</div><div class="ln"><span>Unvan</span>${esc(state.unvan)}</div><div class="ln"><span>Tarih</span>${dateTR(state.tarih)}</div><div class="ln sig"><span>İmza</span></div></div>
      </div>
      <div class="contact"><div><div class="mono-l">Telefon · WhatsApp</div><div class="mono-v"><a href="${BRAND.wa_link}">${BRAND.phone}</a></div></div><div><div class="mono-l">Web</div><div class="mono-v"><a href="${BRAND.url}">${BRAND.domain}</a></div></div></div>`)}
  </div>`;
  document.getElementById("doc").innerHTML = cover + flow;
  document.title = `${state.teklifNo || "Teklif"} · ${state.musteriFirma || BRAND.name}`;
  renderPageCss();
  const sum = document.getElementById("sum");
  if (sum) sum.textContent = `Ara toplam ${money(t.sub)} · KDV ${money(t.kdv)} · Genel toplam ${money(t.total)}`;
}

function update(full) {
  persist();
  if (full) renderForm();
  renderDoc();
}

document.getElementById("form").addEventListener("input", e => {
  const el = e.target;
  if (el.dataset.k) {
    const k = el.dataset.k;
    state[k] = el.type === "checkbox" ? el.checked : el.type === "number" ? (el.value === "" ? "" : Number(el.value)) : el.value;
  } else if (el.dataset.arr) {
    const row = state[el.dataset.arr][Number(el.dataset.i)];
    row[el.dataset.f] = el.type === "number" ? (el.value === "" ? "" : Number(el.value)) : el.value;
  } else return;
  update(false);
});
document.getElementById("form").addEventListener("change", e => { if (e.target.tagName === "SELECT" || e.target.type === "checkbox") update(false); });
document.getElementById("form").addEventListener("click", e => {
  const b = e.target.closest("button");
  if (!b) return;
  if (b.dataset.add === "takvim") state.takvim.push({asama: "", sure: "", cikti: ""});
  else if (b.dataset.add === "kalemler") state.kalemler.push({aciklama: "", miktar: 1, birim: "proje", fiyat: 0});
  else if (b.dataset.del) { state[b.dataset.del].splice(Number(b.dataset.i), 1); if (!state[b.dataset.del].length) state[b.dataset.del].push(b.dataset.del === "takvim" ? {asama: "", sure: "", cikti: ""} : {aciklama: "", miktar: 1, birim: "proje", fiyat: 0}); }
  else return;
  update(true);
});
document.getElementById("print").addEventListener("click", () => window.print());
document.getElementById("save").addEventListener("click", () => {
  const blob = new Blob([JSON.stringify(state, null, 2)], {type: "application/json"});
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = `${(state.teklifNo || "teklif").replace(/[^\w-]+/g, "_")}.json`;
  a.click();
  setTimeout(() => URL.revokeObjectURL(a.href), 1000);
});
document.getElementById("load").addEventListener("change", async e => {
  const file = e.target.files[0];
  if (!file) return;
  try {
    state = Object.assign(structuredClone(BLANK), JSON.parse(await file.text()));
    update(true);
  } catch (err) {
    alert("Dosya okunamadı. Teklif oluşturucudan kaydedilmiş bir .json dosyası seçin.");
  }
  e.target.value = "";
});
document.getElementById("blank").addEventListener("click", () => {
  if (confirm("Mevcut teklif silinip boş bir teklif açılacak. Önce dosyaya kaydettiğinizden emin olun.")) { state = structuredClone(BLANK); update(true); }
});
document.getElementById("sample").addEventListener("click", () => { state = structuredClone(SAMPLE); update(true); });

if (new URLSearchParams(location.search).has("ornek")) state = structuredClone(SAMPLE);
renderForm();
renderDoc();
</script>
</body>
</html>
